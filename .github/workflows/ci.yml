name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. PR Title & Conventional Commit Compliance
  # =========================================================================
  pr-title-check:
    name: Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            model
            geospatial

  # =========================================================================
  # 2. Repository Hygiene (Large File & Secret Prevention)
  # =========================================================================
  repo-hygiene:
    name: Repository Hygiene & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Unwanted Large Files (> 25MB)
        run: |
          echo "Scanning for tracked files exceeding 25MB (use DVC for datasets/models)..."
          LARGE_FILES=$(find . -type f -not -path '*/.*' -size +25M)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Found files larger than 25MB tracked in git. Please track them with DVC instead:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "No oversized files tracked directly in git."

      - name: Check for Accidentally Committed Sensitive Files
        run: |
          echo "Checking for sensitive files (.env, keys, certificates)..."
          LEAKED_FILES=$(find . -type f \( -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "*.key" -o -name "*_rsa" \) -not -name ".env.example")
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::Sensitive credential files detected in repository tree:"
            echo "$LEAKED_FILES"
            exit 1
          fi
          echo "No sensitive credential files detected."

  # =========================================================================
  # 3. Python Backend & ML Modules Quality & Tests
  # =========================================================================
  python-quality:
    name: Python Lint & Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Linting & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint Check
        run: |
          echo "Running Ruff code analysis..."
          ruff check . --output-format=github

      - name: Run Ruff Format Check
        run: |
          echo "Running Ruff format check..."
          ruff format --check .

      - name: Check Python Syntax Across Modules
        run: |
          echo "Verifying Python syntax..."
          python -m compileall -q .

      - name: Run Pytest Test Suite
        run: |
          echo "Running test suite..."
          pytest -v --tb=short

  # =========================================================================
  # 4. Frontend (React / TypeScript) Quality
  # =========================================================================
  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if Frontend Directory Exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "frontend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend package.json not yet present. Skipping Node checks."
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Frontend Lint & Typecheck
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          cd frontend
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test Frontend
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          cd frontend
          npm test --if-present

      - name: Build Frontend Dashboard
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          cd frontend
          npm run build --if-present

  # =========================================================================
  # 5. Documentation & Markdown Linting
  # =========================================================================
  docs-check:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Markdown Links & Formatting
        uses: avto-dev/markdown-lint@v1
        continue-on-error: true
