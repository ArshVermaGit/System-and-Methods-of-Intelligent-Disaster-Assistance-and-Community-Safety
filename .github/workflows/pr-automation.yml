name: PR Size & Automation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-size:
    name: PR Size Labeler
    runs-on: ubuntu-latest
    steps:
      - name: PR Size Calculation
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: '15'
          s_label: 'size/S'
          s_max_size: '100'
          m_label: 'size/M'
          m_max_size: '300'
          l_label: 'size/L'
          l_max_size: '800'
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: >
            ⚠️ This pull request is quite large (> 800 lines changed).
            Consider breaking it down into smaller, focused PRs to make review faster and safer for the team!
          files_to_ignore: |
            package-lock.json
            yarn.lock
            poetry.lock
            *.dvc
            dvc.lock
